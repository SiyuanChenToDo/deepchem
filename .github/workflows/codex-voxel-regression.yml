name: Voxel vector regression (fork validation)

on:
  push:
    branches: [codex/ci-voxel-vector-features]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    if: github.repository == 'SiyuanChenToDo/deepchem'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core and validation dependencies
        run: python -m pip install -e . pytest==9.1.1 yapf==0.32.0 flake8 mypy
      - name: Verify formatting
        run: python -m yapf --diff deepchem/utils/voxel_utils.py deepchem/utils/test/test_voxel_utils.py
      - name: Check changed files
        run: python -m flake8 deepchem/utils/voxel_utils.py deepchem/utils/test/test_voxel_utils.py --count
      - name: Check source types without following optional dependencies
        run: python -m mypy --follow-imports=skip deepchem/utils/voxel_utils.py
      - name: Check doctests
        run: python -m doctest deepchem/utils/voxel_utils.py deepchem/utils/test/test_voxel_utils.py
      - name: Run voxel and hash tests
        run: python -m pytest deepchem/utils/test/test_voxel_utils.py deepchem/utils/test/test_hash_utils.py -q
